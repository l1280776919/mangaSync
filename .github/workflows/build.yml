name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Frontend tests and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Browser regression
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
      - name: Backend checks
        run: |
          go vet ./...
          go test -race ./...
      - name: Build release binaries from the verified frontend
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          FLAGS="-s -w -X github.com/l1280776919/mangaSync/internal/api.Version=${VERSION} -X github.com/l1280776919/mangaSync/internal/api.Commit=${GITHUB_SHA}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$FLAGS" -o dist/mangasync_linux_amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$FLAGS" -o dist/mangasync_linux_arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: mangasync-linux
          path: dist/mangasync_linux_*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mangasync-linux
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/mangasync_linux_*
